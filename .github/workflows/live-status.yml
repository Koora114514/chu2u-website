# ============================================================
#  直播间开播状态 —— 由 GitHub 的服务器定时刷新（搬到云端，不用开电脑）
#
#  为什么能搬：B 站对接口的封锁是按接口分的——实测
#    api.live.bilibili.com（直播状态）→ GitHub 服务器 ✓ 能访问（200）
#    api.bilibili.com（投稿/搜索）    → GitHub 服务器 ✗ 被封（412）
#  所以「歌单/观测记录/猫猫宇宙论」只能在本机跑，唯独直播状态可以搬上来。
#
#  省额度：**只有「开播 ↔ 下播」真的变了才提交**。
#  Cloudflare 免费版每月只有 500 次构建，每 10 分钟提交一次会瞬间用光。
#  平时（状态没变）这一步什么都不做。
#
#  页面显示策略配套：数据 12 小时内照实显示，超过 12 小时一律显示「未开播」
#  （宁可保守也不谎报直播中），所以这里不需要为了「保持新鲜」而空提交。
# ============================================================
name: 直播间状态

on:
  schedule:
    - cron: '*/10 * * * *'   # 每 10 分钟（GitHub 的定时任务最密 5 分钟，实际常有几分钟延迟）
  workflow_dispatch:          # 也可以在 GitHub 网页上手动点一下跑一次
  push:                       # 每次推送顺带刷一次，方便立刻验证

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # 需要写权限才能把结果提交回去
    steps:
      - uses: actions/checkout@v4

      - name: 抓状态，只有开播/下播变了才提交
        id: probe
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          REF="https://live.bilibili.com/1727074031"
          API="https://api.live.bilibili.com/room/v1/Room/get_info?room_id=1727074031"

          code=$(curl -s -o /tmp/r.json -w "%{http_code}" --max-time 25 \
                 -H "User-Agent: $UA" -H "Referer: $REF" "$API" || echo "000")
          if [ "$code" != "200" ]; then
            echo "抓取失败（HTTP $code），保持原样，等下一轮"
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          import json, datetime
          d = json.load(open('/tmp/r.json', encoding='utf-8'))
          x = d.get('data') or {}
          live = (x.get('live_status') == 1)          # 与本站口径一致：只有 1 算直播中，2（轮播）不算
          # live_time：未开播时是 "0000-00-00 00:00:00"；开播时可能是 epoch 秒或北京时间字符串
          lt = str(x.get('live_time') or '')
          start = -1
          if lt.isdigit():
              start = int(lt)
          elif len(lt) == 19:
              try:
                  dt = datetime.datetime.strptime(lt, '%Y-%m-%d %H:%M:%S') - datetime.timedelta(hours=8)
                  start = int(dt.replace(tzinfo=datetime.timezone.utc).timestamp())
              except Exception:
                  start = -1
          t = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=8)  # checked 用北京时间
          obj = {
              "live": live,
              "title": x.get('title') or "",
              "online": (x.get('online') or 0) if live else 0,
              "area": x.get('parent_area_name') or "",
              "start": start,
              "checked": t.strftime('%Y-%m-%d %H:%M:%S'),
          }
          # 直接写文件而不是 print：避免不同系统 stdout 编码不一样（Windows 是 GBK，遇 ⭐ 会报错）
          open('/tmp/new.js', 'w', encoding='utf-8').write(
              "window.CHU2U_LIVE=" + json.dumps(obj, ensure_ascii=False, separators=(',', ':')) + ";")
          PY

          new_live=$(python3 -c "import re;s=open('/tmp/new.js',encoding='utf-8').read();print(re.search(r'\"live\":(true|false)',s).group(1))")
          old_live=$(python3 -c "
          import re, os
          p = 'data/live.js'
          print(re.search(r'\"live\":(true|false)', open(p, encoding='utf-8').read()).group(1) if os.path.exists(p) else '')
          " 2>/dev/null)
          echo "抓到的状态=$new_live   仓库里的状态=$old_live"

          if [ "$new_live" = "$old_live" ]; then
            echo "开播状态没变 → 不提交（省 Cloudflare 每月 500 次的构建额度）"
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            cp /tmp/new.js data/live.js
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交并推送
        if: steps.probe.outputs.changed == '1'
        run: |
          git config user.name "chu2u-live-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live.js
          git commit -m "直播状态更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
          echo "已提交，Cloudflare 会在 1~2 分钟内重新发布"
