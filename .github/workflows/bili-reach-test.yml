# 【临时测试 第二轮】观测记录搬上云端到底缺什么
#  1) 搜索接口返回的字段够不够（标题/简介/封面/播放/评论/发布时间——这些是观测记录条目必须的）
#  2) 封面图 CDN（i0.hdslb.com）能不能从 GitHub 下载
#  3) 猫猫宇宙论话题流返回的条目里有没有封面和作者
# 测完即删。
name: bili-reach-test
on: push

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 深入探测
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          REF="https://www.bilibili.com/"
          : > bili-test-result.txt
          echo "时间(UTC): $(date -u '+%Y-%m-%d %H:%M:%S')" >> bili-test-result.txt

          echo "--- ① 搜索接口返回的字段（观测记录必需）---" >> bili-test-result.txt
          curl -s --max-time 25 -H "User-Agent: $UA" -H "Referer: $REF" \
            "https://api.bilibili.com/x/web-interface/search/type?search_type=video&keyword=%E7%BE%BD%E5%95%BEchu2u&page=1" \
            -o /tmp/s.json
          python3 - >> bili-test-result.txt <<'PY'
          import json
          try:
              d = json.load(open('/tmp/s.json', encoding='utf-8'))
              r = (d.get('data') or {}).get('result') or []
              print("结果条数:", len(r))
              if r:
                  x = r[0]
                  need = ['bvid','title','description','pic','pubdate','play','video_review','author','mid']
                  for k in need:
                      v = x.get(k)
                      print("  %-14s %s" % (k, (str(v)[:70] if v not in (None, '') else '❌ 缺')))
          except Exception as e:
              print("解析失败:", e)
          PY

          echo "--- ② 封面图 CDN 能不能下载 ---" >> bili-test-result.txt
          pic=$(python3 -c "
          import json,re
          try:
              d=json.load(open('/tmp/s.json',encoding='utf-8'));r=(d.get('data') or {}).get('result') or []
              print((r[0].get('pic') or '') if r else '')
          except Exception: print('')
          " 2>/dev/null)
          pic=$(echo "$pic" | sed 's|^//|https://|')
          if [ -n "$pic" ]; then
            c=$(curl -s -o /tmp/p.bin -w "%{http_code}" --max-time 25 -H "User-Agent: $UA" -H "Referer: $REF" "$pic" || echo 000)
            echo "封面图 HTTP=$c 大小=$(stat -c%s /tmp/p.bin 2>/dev/null || echo 0) 字节" >> bili-test-result.txt
          else
            echo "搜索没返回封面地址，跳过" >> bili-test-result.txt
          fi

          echo "--- ③ 猫猫话题流返回的条目结构 ---" >> bili-test-result.txt
          curl -s --max-time 25 -H "User-Agent: $UA" -H "Referer: $REF" \
            "https://api.bilibili.com/x/polymer/web-dynamic/v1/feed/topic?topic_id=1345548&page=1" -o /tmp/t.json
          python3 - >> bili-test-result.txt <<'PY'
          import json
          try:
              d = json.load(open('/tmp/t.json', encoding='utf-8'))
              dd = d.get('data') or {}
              print("code =", d.get('code'), " has_more =", (dd.get('topic_card_list') or {}).get('has_more'))
              items = (dd.get('topic_card_list') or {}).get('items') or dd.get('items') or []
              print("条目数:", len(items))
              if items:
                  it = items[0]
                  print("条目字段:", ", ".join(list(it.keys())[:12]))
                  print("第一条:", json.dumps(it, ensure_ascii=False)[:300])
          except Exception as e:
              print("解析失败:", e)
          PY

          cat bili-test-result.txt

      - name: 提交结果
        run: |
          git config user.name "chu2u-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bili-test-result.txt
          git commit -m "接口深探结果" || echo "无变化"
          git push
